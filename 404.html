<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Route Not Found | Shoaib Asghar</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0F17; --paper:#EDEEF2; --muted:#8993A8; --copper:#E28D4F; --teal:#52C7B8; --line:rgba(233,234,238,0.12);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px;
}
.wrap{max-width:520px;}
.code{font-family:'Space Grotesk',sans-serif; font-size:clamp(70px,16vw,140px); color:var(--copper); line-height:1; margin-bottom:10px;}
h1{font-family:'Space Grotesk',sans-serif; font-size:24px; margin-bottom:14px;}
p{color:var(--muted); font-size:15px; margin-bottom:30px; line-height:1.6;}
svg{width:60px; height:60px; margin:0 auto 20px; display:block;}
a.btn{
  font-family:'JetBrains Mono',monospace; font-size:13px; background:var(--copper); color:#0B0F17;
  padding:14px 26px; border-radius:10px; display:inline-flex; gap:8px; font-weight:600; transition:.25s;
}
a.btn:hover{transform:translateY(-2px);}
.tag{font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--teal); margin-bottom:18px; display:block;}
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 100 60" fill="none"><path d="M5 50 L30 25 L48 38 L95 8" stroke="#E28D4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><circle cx="5" cy="50" r="4" fill="#52C7B8"/><circle cx="95" cy="8" r="4" fill="#EDEEF2" stroke="#E28D4F" stroke-width="2"/></svg>
    <span class="tag">Routing Error</span>
    <div class="code">404</div>
    <h1>No route to this page</h1>
    <p>The Fuel Route Optimizer couldn't find a path here either. The page you're looking for was moved, renamed, or never existed.</p>
    <a class="btn" href="./index.html">← Back to home</a>
  </div>
</body>
</html>
